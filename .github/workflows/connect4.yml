name: Connect 4

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# One move at a time, so two visitors can never race on the board.
concurrency:
  group: connect4
  cancel-in-progress: false

jobs:
  play:
    if: startsWith(github.event.issue.title, 'connect4|')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The issue title and author are untrusted: they only reach the script through env vars.
      - name: Apply the move
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
          RESULT_FILE: ${{ runner.temp }}/connect4-result.md
        run: node .github/scripts/connect4.mjs

      - name: Commit the new board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/state.json
          if git diff --cached --quiet; then
            echo "Board unchanged."
          else
            git commit -m "chore(connect4): update board"
            git pull --rebase
            git push
          fi

      - name: Reply and close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT_FILE: ${{ runner.temp }}/connect4-result.md
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file "$RESULT_FILE"
          gh issue close "$ISSUE_NUMBER" --reason completed
